<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yenikale Sosyal Tesisleri | Akıllı Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #d4af37;
            --gold-hover: #b5952f;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --navy: #0f172a;
            --admin-dark: #111827;
            --card-bg: #1f2937;
            --input-bg: #374151;
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background: #020617;
            color: var(--text-light);
            overflow: hidden;
        }

        /* --- SOL VERİ GİRİŞ PANELİ --- */
        .admin-sidebar {
            width: 380px;
            min-width: 380px;
            background: var(--admin-dark);
            padding: 25px 20px;
            box-sizing: border-box;
            border-right: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 5px 0 25px rgba(0,0,0,0.5);
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto; /* Dikey kaydırma aktif */
            height: 100%;
        }

        /* Scrollbar tasarımı */
        .admin-sidebar::-webkit-scrollbar { width: 6px; }
        .admin-sidebar::-webkit-scrollbar-track { background: var(--admin-dark); }
        .admin-sidebar::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 10px; }

        .panel-header {
            color: var(--gold);
            text-align: center;
            font-size: 1.3rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            background: var(--admin-dark);
            padding-bottom: 10px;
            z-index: 5;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .section-group {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            animation: slideInLeft 0.3s ease-out;
        }

        .category-header-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            gap: 10px;
        }

        .category-title-input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--gold);
            font-size: 1rem;
            font-weight: 800;
            text-transform: uppercase;
            padding: 5px 0;
            border-bottom: 1px solid var(--input-bg);
            outline: none;
            transition: border-color 0.3s;
        }
        .category-title-input:focus { border-bottom-color: var(--gold); }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 1.1rem;
        }
        .icon-btn:hover { background: rgba(255,255,255,0.1); color: #fff; }
        .icon-btn.danger:hover { color: var(--danger); background: rgba(239, 68, 68, 0.1); }
        .icon-btn.active-page-break { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }

        .input-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
        
        input {
            background: var(--input-bg);
            border: 1px solid transparent;
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.3s ease;
        }
        input:focus { border-color: var(--gold); background: #1f2937; }
        input.name { flex: 1; }
        input.price { width: 60px; text-align: center; font-weight: 600; }

        .btn-add-item {
            width: 100%;
            background: rgba(255,255,255,0.05);
            color: var(--text-light);
            border: 1px dashed var(--text-muted);
            padding: 8px;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 5px;
            transition: all 0.2s;
            font-size: 0.8rem;
        }
        .btn-add-item:hover { background: rgba(255,255,255,0.1); border-color: var(--gold); color: var(--gold); }

        .btn-add-category {
            background: var(--navy);
            color: var(--gold);
            border: 2px solid var(--gold);
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
            margin-bottom: 30px;
        }
        .btn-add-category:hover { background: var(--gold); color: var(--navy); }

        /* --- SAĞ ÖNİZLEME ALANI --- */
        .preview-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: radial-gradient(circle at top right, #1e293b 0%, #020617 100%);
            overflow: hidden;
        }

        .view-toggles {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 20px;
            background: rgba(0,0,0,0.2);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .view-btn {
            background: #1f2937;
            color: #fff;
            border: 1px solid #374151;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }
        .view-btn.active { background: var(--gold); color: var(--navy); border-color: var(--gold); }

        .pages-container {
            flex: 1;
            padding: 30px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            scroll-behavior: smooth;
        }

        /* Kaydırma Çubuğu Tasarımı */
        .pages-container::-webkit-scrollbar { width: 8px; }
        .pages-container::-webkit-scrollbar-track { background: transparent; }
        .pages-container::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.5); border-radius: 10px; }

        /* A4 ve Sayfa Tasarımı */
        .paper-scale-wrapper {
            width: calc(210mm * 0.5); /* Ekrana sığması için %50 küçültme */
            height: calc(297mm * 0.5);
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            border-radius: 4px;
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            flex-shrink: 0;
        }

        .a4-sim {
            width: 210mm;
            height: 297mm;
            background: white;
            color: black;
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
            transform: scale(0.5);
            transform-origin: top left;
        }

        /* --- MENÜ İÇERİK TASARIMLARI --- */
        .print-box {
            width: 100%;
            height: 100%;
            padding: 20mm;
            box-sizing: border-box;
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .gunluk-style { border: 6px double var(--gold); }
        .adisyon-style { 
            width: 90mm; 
            margin: 0 auto; 
            border: 2px solid var(--gold); 
            height: auto; 
            min-height: 100%; 
            background: #fffafa; 
        }

        .header { text-align: center; margin-bottom: 20px; border-bottom: 2px solid #f3f4f6; padding-bottom: 15px; flex-shrink: 0;}
        .header h4 { margin: 0; font-size: 1.1rem; color: #6b7280; font-weight: 600; }
        .header h1 { margin: 8px 0; font-family: 'Georgia', serif; font-size: 2.5rem; color: var(--navy); }
        .date { font-weight: bold; color: #856404; font-size: 1.2rem; }

        .content-area { flex: 1; overflow: hidden; /* Taşmayı ölçmek için */ }

        .menu-section { margin-bottom: 18px; }
        .section-title { color: #856404; font-weight: 800; border-bottom: 2px solid #fef08a; margin-bottom: 12px; text-align: center; font-size: 1.5rem; padding-bottom: 5px;}
        .menu-item { display: flex; justify-content: space-between; font-family: 'Georgia', serif; font-size: 1.6rem; margin-bottom: 12px; color: #1f2937;}
        .dots { flex-grow: 1; border-bottom: 2px dotted #d1d5db; margin: 0 15px; position: relative; top: -6px; }
        
        .signature { margin-top: auto; text-align: right; font-size: 1.1rem; line-height: 1.6; font-family: 'Georgia', serif; color: #374151; padding-top: 20px; flex-shrink: 0;}

        /* Animasyonlar */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-20px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* --- YAZDIRMA AYARLARI --- */
        @media print {
            body { background: white; overflow: visible; height: auto; display: block; }
            .admin-sidebar, .view-toggles { display: none !important; }
            .preview-area { display: block; background: none; }
            .pages-container { padding: 0; gap: 0; display: block; overflow: visible; }
            
            .paper-scale-wrapper { width: 100%; height: auto; box-shadow: none; animation: none; page-break-after: always; margin-bottom: 0;}
            .a4-sim { transform: none !important; position: static; width: 210mm; height: 297mm; }
            
            @page { margin: 0; size: A4; }
        }
    </style>
</head>
<body>

<div class="admin-sidebar" id="sidebar">
    <div class="panel-header">
        ⚜️ YENİKALE KONTROL PANELİ
        <div style="font-size: 0.8rem; font-weight: 400; color: #9ca3af; margin-top: 5px;">Ulş. Er Mubin Duhan Aslan</div>
    </div>
    
    <div id="categories-container">
        </div>

    <button class="btn-add-category" onclick="addCategory()">+ YENİ KATEGORİ EKLE</button>
</div>

<div class="preview-area">
    <div class="view-toggles">
        <button class="view-btn active" id="btn-gunluk" onclick="setViewMode('gunluk')">📜 Günlük Menü Görünümü</button>
        <button class="view-btn" id="btn-adisyon" onclick="setViewMode('adisyon')">📄 Adisyon Görünümü</button>
        <button class="view-btn" style="background: var(--gold); color: #000;" onclick="window.print()">🖨️ Sayfaları Yazdır</button>
    </div>
    
    <div class="pages-container" id="pages-container">
        </div>
</div>

<script>
    const tarih = new Date().toLocaleDateString('tr-TR', {day:'numeric', month:'long', year:'numeric'});
    let activeView = 'gunluk'; // 'gunluk' veya 'adisyon'

    // Başlangıç Veri Modeli
    let menuData = [
        { id: generateId(), name: 'GÜNÜN ÇORBASI', pageBreak: false, items: [{id: generateId(), name: '', price: ''}] },
        { id: generateId(), name: 'ARA SICAKLAR', pageBreak: false, items: [{id: generateId(), name: '', price: ''}, {id: generateId(), name: '', price: ''}] },
        { id: generateId(), name: 'ANA YEMEKLER', pageBreak: false, items: [{id: generateId(), name: '', price: ''}] }
    ];

    function generateId() {
        return Math.random().toString(36).substr(2, 9);
    }

    // --- SOL PANEL (SİDEBAR) İŞLEMLERİ ---

    function renderSidebar() {
        const container = document.getElementById('categories-container');
        container.innerHTML = '';

        menuData.forEach((cat, catIndex) => {
            const catDiv = document.createElement('div');
            catDiv.className = 'section-group';

            // Kategori Başlık ve Butonlar
            let itemsHtml = '';
            cat.items.forEach((item, itemIndex) => {
                itemsHtml += `
                    <div class="input-row">
                        <input type="text" class="name" placeholder="Yemek Adı" value="${item.name}" oninput="updateItem('${cat.id}', '${item.id}', 'name', this.value)">
                        <input type="text" class="price" placeholder="₺" value="${item.price}" oninput="updateItem('${cat.id}', '${item.id}', 'price', this.value)">
                        <button class="icon-btn danger" title="Yemeği Sil" onclick="removeItem('${cat.id}', '${item.id}')">✖</button>
                    </div>
                `;
            });

            catDiv.innerHTML = `
                <div class="category-header-controls">
                    <input type="text" class="category-title-input" value="${cat.name}" placeholder="KATEGORİ ADI" oninput="updateCategoryName('${cat.id}', this.value)">
                    <button class="icon-btn ${cat.pageBreak ? 'active-page-break' : ''}" title="Bu kategoriyi yeni A4 sayfasında başlat" onclick="togglePageBreak('${cat.id}')">📄</button>
                    <button class="icon-btn danger" title="Kategoriyi Sil" onclick="removeCategory('${cat.id}')">🗑️</button>
                </div>
                ${itemsHtml}
                <button class="btn-add-item" onclick="addItem('${cat.id}')">+ Yemek Ekle</button>
            `;
            container.appendChild(catDiv);
        });

        renderPreviews(); // Arayüzü güncelle
    }

    function addCategory() {
        menuData.push({ id: generateId(), name: 'YENİ KATEGORİ', pageBreak: false, items: [{id: generateId(), name: '', price: ''}] });
        renderSidebar();
    }

    function removeCategory(catId) {
        menuData = menuData.filter(c => c.id !== catId);
        renderSidebar();
    }

    function updateCategoryName(catId, val) {
        const cat = menuData.find(c => c.id === catId);
        if(cat) { cat.name = val; renderPreviews(); }
    }

    function togglePageBreak(catId) {
        const cat = menuData.find(c => c.id === catId);
        if(cat) { cat.pageBreak = !cat.pageBreak; renderSidebar(); }
    }

    function addItem(catId) {
        const cat = menuData.find(c => c.id === catId);
        if(cat) { cat.items.push({id: generateId(), name: '', price: ''}); renderSidebar(); }
    }

    function removeItem(catId, itemId) {
        const cat = menuData.find(c => c.id === catId);
        if(cat) { 
            cat.items = cat.items.filter(i => i.id !== itemId); 
            renderSidebar(); 
        }
    }

    function updateItem(catId, itemId, field, val) {
        const cat = menuData.find(c => c.id === catId);
        if(cat) {
            const item = cat.items.find(i => i.id === itemId);
            if(item) { item[field] = val; renderPreviews(); }
        }
    }

    // --- SAĞ PANEL (ÖNİZLEME & SAYFALANDIRMA) İŞLEMLERİ ---

    function setViewMode(mode) {
        activeView = mode;
        document.getElementById('btn-gunluk').classList.toggle('active', mode === 'gunluk');
        document.getElementById('btn-adisyon').classList.toggle('active', mode === 'adisyon');
        renderPreviews();
    }

    function createNewPageDOM() {
        const wrapper = document.createElement('div');
        wrapper.className = 'paper-scale-wrapper';

        const a4 = document.createElement('div');
        a4.className = 'a4-sim';

        const printBox = document.createElement('div');
        printBox.className = `print-box ${activeView === 'gunluk' ? 'gunluk-style' : 'adisyon-style'}`;

        const header = document.createElement('div');
        header.innerHTML = `
            <div class="header">
                <h4>GAZİEMİR KIŞLA GAZİNO MÜDÜRLÜĞÜ</h4>
                <h1>YENİKALE SOSYAL TESİSLERİ</h1>
                <div class="date">${tarih}</div>
            </div>
        `;
        printBox.appendChild(header);

        const contentArea = document.createElement('div');
        contentArea.className = 'content-area';
        printBox.appendChild(contentArea);

        a4.appendChild(printBox);
        wrapper.appendChild(a4);

        return { wrapper, contentArea, printBox };
    }

    function renderPreviews() {
        const container = document.getElementById('pages-container');
        container.innerHTML = '';

        let currentPageObj = createNewPageDOM();
        container.appendChild(currentPageObj.wrapper);

        let isAnyContentAdded = false;

        menuData.forEach((cat, catIndex) => {
            // Kullanıcı bu kategoriyi yeni sayfada başlatmak istediyse VE bu ilk sayfa değilse:
            if (cat.pageBreak && isAnyContentAdded) {
                currentPageObj = createNewPageDOM();
                container.appendChild(currentPageObj.wrapper);
            }

            // Kategori başlığını oluştur
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'menu-section';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'section-title';
            titleDiv.innerText = cat.name;
            sectionDiv.appendChild(titleDiv);

            currentPageObj.contentArea.appendChild(sectionDiv);

            // Başlık sığıyor mu kontrol et
            if (currentPageObj.contentArea.scrollHeight > currentPageObj.contentArea.clientHeight) {
                // Sığmıyorsa bu başlığı yeni sayfaya taşı
                sectionDiv.remove();
                currentPageObj = createNewPageDOM();
                container.appendChild(currentPageObj.wrapper);
                currentPageObj.contentArea.appendChild(sectionDiv);
            }

            // Yemekleri ekle
            cat.items.forEach(item => {
                if(item.name.trim() === '') return; // Boş yemekleri yazıcıya gönderme
                isAnyContentAdded = true;

                const itemDiv = document.createElement('div');
                itemDiv.className = 'menu-item';
                itemDiv.innerHTML = `
                    <span>${item.name}</span>
                    <span class="dots"></span>
                    <span>${item.price ? item.price + ' TL' : ''}</span>
                `;
                
                sectionDiv.appendChild(itemDiv);

                // Yemek eklendikten sonra sayfaya sığıyor mu kontrol et
                if (currentPageObj.contentArea.scrollHeight > currentPageObj.contentArea.clientHeight) {
                    // Sığmıyorsa yemeği çıkart, yeni sayfa aç, başlığı ve yemeği oraya koy
                    itemDiv.remove();
                    currentPageObj = createNewPageDOM();
                    container.appendChild(currentPageObj.wrapper);
                    
                    const newSectionDiv = document.createElement('div');
                    newSectionDiv.className = 'menu-section';
                    
                    const newTitleDiv = document.createElement('div');
                    newTitleDiv.className = 'section-title';
                    newTitleDiv.innerText = cat.name + ' (Devamı)';
                    
                    newSectionDiv.appendChild(newTitleDiv);
                    newSectionDiv.appendChild(itemDiv);
                    currentPageObj.contentArea.appendChild(newSectionDiv);
                    
                    // Sonraki yemekler bu yeni section'a eklensin diye referansı güncelle
                    Object.assign(sectionDiv, newSectionDiv);
                }
            });

            // Eğer kategori tamamen boşsa başlığı DOM'dan kaldır (görüntü kirliliği yapmasın)
            if (sectionDiv.querySelectorAll('.menu-item').length === 0) {
                sectionDiv.remove();
            }
        });

        // En son sayfanın en altına imzayı ekle
        const signature = document.createElement('div');
        signature.className = 'signature';
        signature.innerHTML = `
            <strong>Sedat İBİL</strong><br>
            Per.Asb.Kd.Bçvş<br>
            Yenikale Lokanta Mutfak Ks.A.
        `;
        
        currentPageObj.printBox.appendChild(signature);
        
        // İmza eklendikten sonra taştıysa imzayı da yeni sayfaya atalım
        if (currentPageObj.printBox.scrollHeight > currentPageObj.printBox.clientHeight) {
            signature.remove();
            currentPageObj = createNewPageDOM();
            container.appendChild(currentPageObj.wrapper);
            currentPageObj.printBox.appendChild(signature);
        }
    }

    // Uygulamayı Başlat
    renderSidebar();

</script>
</body>
</html>
